apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: tax-calculator-pipeline-run-
spec:
  pipelineRef:
    name: tax-calculator-pipeline
  params:
    - name: IMAGE
      value: us.icr.io/tax-calculator/tax-calculator:latest
  workspaces:
    - name: source
      persistentVolumeClaim:
        claimName: tax-calculator-pvc
